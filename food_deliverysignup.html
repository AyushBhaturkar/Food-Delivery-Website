<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in </title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Page background */
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main form container */
        .signinform {
            background-color: #fff;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        }

        /* Title */
        .form-title {
            text-align: center;
            color: #e60000;
            margin-bottom: 5px;
        }

        /* Subtitle */
        .form-subtitle {
            text-align: center;
            color: #000;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Form groups */
        .form-group {
            margin-bottom: 15px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #000;
        }

        /* Inputs & textarea */
        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #000;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        /* Focus effect */
        input:focus,
        textarea:focus {
            border-color: #e60000;
        }

        /* Error message */
        .error-msg {
            color: #e60000;
            font-size: 12px;
        }

        /* Button */
        button {
            width: 100%;
            padding: 12px;
            background-color: #e60000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Button hover */
        button:hover {
            background-color: #000;
        }

        /* Footer */
        .form-footer {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #000;
        }

        /* Footer link */
        .form-footer span {
            color: #e60000;
            font-weight: bold;
            cursor: pointer;
        }

        /* Checkbox container */
        .checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            /* space between checkbox & text */
            white-space: nowrap;
            /* prevents line break */
            font-size: 14px;
            color: #000;
        }

        /* Checkbox */
        .checkbox input[type="checkbox"] {
            cursor: pointer;
            accent-color: #e60000;
        }

        /* Label */
        .checkbox label {
            cursor: pointer;
        }

        /* Link */
        .checkbox a {
            color: #e60000;
            text-decoration: none;
            font-weight: bold;
        }

        .checkbox a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="signinform">

        <!-- Form Heading -->
        <h2 class="form-title">Sign In</h2>
        <p class="form-subtitle">Please fill in your details</p>

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter your name">
            <small class="error-msg"> </small>
        </div>

        <div class="form-group">
            <label for="mob">Mobile No</label>
            <input id="mob" type="number" placeholder="Enter your mobile number">
            <small class="error-msg"> </small>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" rows="4" placeholder="Enter your address"></textarea>
        </div>
        <div class="checkbox">

            <input id="terms_condition" type="checkbox">
            <label for="terms_condition"> I agree the <a href="#" target="_blank">terms and condition</a></label>
        </div>
        <div class="form-group">
            <button type="submit">Submit</button>
        </div>

        <!-- Footer text -->
        <p class="form-footer">
            Already registered? <span><a href="foodDelivery_loginpage.html" rel="login">Login</a> </span>
        </p>

    </div>
</body>

</html>
